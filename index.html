<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام المراقبة الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0e1f;--card:#111936;--line:#1f2a52;--txt:#e8ecff;--mut:#8a94c2;
--t:#ff7a45;--h:#4db8ff;--g:#ffd043;--r:#9b7bff;--f:#ff4d5e;--w:#3ee0c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#1b2352,transparent),var(--bg);color:var(--txt);font-family:Cairo,Tahoma,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:800}
.live{font-size:12px;color:var(--mut)}
.banner{border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,#17224d,#111936);border:1px solid var(--line);margin-bottom:14px;display:flex;align-items:center;gap:12px;transition:.3s}
.banner b{font-size:16px;display:block}.banner span{font-size:12px;color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%;background:#3ee07a;box-shadow:0 0 12px #3ee07a;flex:none}
.banner.bad{border-color:var(--f);background:linear-gradient(135deg,#3a1220,#111936)}
.banner.bad .dot{background:var(--f);box-shadow:0 0 14px var(--f);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.sim{border:1.5px dashed #6b5a2a;border-radius:18px;padding:12px;margin-bottom:14px;background:#14131c}
.sim p{margin:0 0 10px;font-size:13px;color:#d9c27a}
.sim div{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:13px;font-weight:600;color:#ffcf6b;background:#2c2212;border:0;border-radius:12px;padding:9px 14px;cursor:pointer}
button:hover{background:#3a2d16}button:focus-visible{outline:2px solid var(--g)}
button.reset{color:var(--txt);background:#1f2a52}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card));border:1px solid var(--line);border-radius:22px;padding:14px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.val{font-size:38px;font-weight:800;color:var(--c);margin:12px 0 8px;line-height:1;direction:ltr;text-align:right}
.val small{font-size:15px;margin-inline-start:4px}
.bar{display:flex;gap:3px;direction:ltr;height:26px}
.bar i{flex:1;border-radius:3px;background:#1c2447}
.bar i.on{background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.chip{display:inline-block;margin-top:12px;padding:5px 14px;border-radius:12px;font-size:13px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.chip.bad{color:#fff;background:var(--f)}
.gear{background:#1f2a52;color:var(--txt);font-size:18px;padding:6px 12px;margin-inline-start:10px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.mod{width:100%;max-width:440px;background:#0b1633;border:1px solid #1b6a80;border-radius:28px;padding:20px}
.mod h2{margin:0 0 14px;font-size:22px}
.seg{display:flex;background:#050c1c;border-radius:18px;padding:5px;gap:5px;margin-bottom:14px}
.seg button{flex:1;background:none;color:var(--mut);border-radius:14px;padding:12px}
.seg button.act{background:linear-gradient(135deg,#1de9ff,#2f8cff);color:#04122b}
.mod label{font-size:14px;color:var(--mut);display:block;margin-bottom:8px}
.mod input{width:100%;background:#050c1c;border:1px solid #17305a;border-radius:18px;padding:16px;color:var(--txt);font:inherit;font-size:17px;text-align:left}
.mod input:focus-visible{outline:2px solid #2f8cff}
.hint{font-size:13px;line-height:1.7;color:var(--mut);margin:10px 0 16px}
.acts{display:flex;gap:10px}
.acts button{flex:1;padding:14px;font-size:16px;border-radius:18px;background:#10224a;color:var(--txt)}
.acts .save{background:linear-gradient(135deg,#1de9ff,#2f8cff);color:#04122b;flex:1.5}
footer{text-align:center;font-size:12px;color:var(--mut);margin:18px 0 6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="lg" style="position:fixed;inset:0;z-index:9999;background:radial-gradient(900px 500px at 80% -10%,#1b2352,transparent),#0a0e1f;display:none;align-items:center;justify-content:center;padding:20px;font-family:Cairo,Tahoma,sans-serif">
<form id="lgf" style="width:100%;max-width:380px;background:#111936;border:1px solid #1f2a52;border-radius:28px;padding:28px;text-align:center;color:#e8ecff">
<div style="width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#ffe066,#f0b43c);display:flex;align-items:center;justify-content:center;font-size:32px">⚡</div>
<h2 style="margin:0 0 4px;font-size:22px">نظام المراقبة الذكي</h2>
<p style="margin:0 0 18px;color:#8a94c2;font-size:13px">سجّل الدخول لعرض البيانات</p>
<input id="lge" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required style="width:100%;padding:14px;margin:6px 0;border-radius:14px;border:1px solid #1f2a52;background:#070b18;color:#e8ecff;font:inherit;font-size:15px">
<input id="lgp" type="password" placeholder="كلمة المرور" autocomplete="current-password" required style="width:100%;padding:14px;margin:6px 0;border-radius:14px;border:1px solid #1f2a52;background:#070b18;color:#e8ecff;font:inherit;font-size:15px">
<div id="lgx" hidden style="color:#ff4d5e;font-size:13px;margin:6px 0">البريد أو كلمة المرور غير صحيحة</div>
<button type="submit" style="width:100%;padding:14px;margin-top:10px;border-radius:14px;border:0;background:linear-gradient(135deg,#6ee0ff,#4d8cff);color:#06101f;font:inherit;font-weight:800;font-size:16px;cursor:pointer">تسجيل الدخول</button>
</form></div>
<script>
function H(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
var OK='zccdzsp2jw';
(function(){var lg=document.getElementById('lg'),ok=false;try{ok=localStorage.getItem('auth')===OK}catch(e){}
if(ok)return;lg.style.display='flex';
document.getElementById('lgf').onsubmit=function(e){e.preventDefault();
var v=H(document.getElementById('lge').value.trim().toLowerCase()+'|'+document.getElementById('lgp').value);
if(v===OK){try{localStorage.setItem('auth',OK)}catch(x){}lg.style.display='none'}else{document.getElementById('lgx').hidden=false}}})();
</script>

<header><h1>نظام مراقبة متكامل</h1><div style="display:flex;align-items:center"><div class="live"><span id="cs">وضع تجريبي</span> · <span id="clock">--:--:--</span></div><button class="gear" id="snd" aria-label="كتم الصوت">🔔</button><button class="gear" id="gear" aria-label="إعدادات الاتصال">⚙️</button></div></header>

<div class="banner" id="banner"><div class="dot"></div><div><b id="bt">كل شيء آمن</b><span id="bs">جميع الحساسات ضمن الحدود الطبيعية</span></div></div>

<div class="sim"><p>تجريبي: القيم وهمية لتشاهد الموقع. جرّب:</p>
<div>
<button data-s="rain">محاكاة مطر</button>
<button data-s="gas">محاكاة ارتفاع الغاز</button>
<button data-s="flame">محاكاة حريق</button>
<button data-s="water">محاكاة ارتفاع الماء</button>
<button class="reset" data-s="reset">إعادة ضبط</button>
</div></div>

<main class="grid" id="grid"></main>

<div class="ov" id="ov" hidden><div class="mod" role="dialog" aria-label="إعدادات الاتصال">
<h2>إعدادات الاتصال</h2>
<div class="seg"><button id="m-local" class="act">شبكة محلية</button><button id="m-net">من أي مكان (إنترنت)</button></div>
<label id="lb" for="addr"></label><input id="addr" dir="ltr" autocomplete="off">
<p class="hint" id="hint"></p>
<div class="acts"><button class="save" id="save">حفظ</button><button id="cancel">إلغاء</button></div>
</div></div>
<div id="err" style="display:none;background:#ff4d5e;color:#fff;padding:10px;border-radius:12px;margin:12px 0;direction:ltr;font:12px monospace"></div>
<script>window.onerror=function(m,u,l){var e=document.getElementById("err");if(e){e.style.display="block";e.textContent="JS error: "+m+" (line "+l+")"}};</script>
<script>
function stamp(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB')}
var S0={temp:25.7,hum:51.5,gas:11.6,rain:0,flame:0,water:18};
var S=Object.assign({},S0);
var AL={};
function hy(k,v,on,off){if(!AL[k]&&v>=on)AL[k]=true;else if(AL[k]&&v<off)AL[k]=false;return !!AL[k]}
var C=[
 {k:'temp',n:'حرارة الجو',ic:'🌡️',c:'--t',u:'°م',max:50,st:function(v){return v<18?['بارد',0]:v<32?['معتدل',0]:['حار',0]}},
 {k:'hum',n:'رطوبة الجو',ic:'💧',c:'--h',u:'%',max:100,st:function(v){return v<30?['جاف',0]:v<=70?['مريح',0]:['رطب جداً',0]}},
 {k:'gas',n:'نسبة الغاز (MQ-2)',ic:'🔥',c:'--g',u:'%',max:100,st:function(v){return hy('gas',v,60,45)?['إنذار: تسرب غاز',1]:v>=30?['تحذير',0]:['آمن',0]}},
 {k:'rain',n:'المطر',ic:'🌧️',c:'--r',u:'%',max:100,st:function(v){return v<10?['لا يوجد مطر',0]:v<50?['رذاذ',0]:['مطر غزير',0]}},
 {k:'flame',n:'حساس الحريق',ic:'🚨',c:'--f',u:'%',max:100,st:function(v){return hy('flame',v,50,21)?['إنذار: تم كشف لهب!',1]:['لا يوجد حريق',0]}},
 {k:'water',n:'مستوى الماء',ic:'🌊',c:'--w',u:'%',max:100,st:function(v){return hy('water',v,70,60)?['إنذار: خطر فيضان',1]:v>=50?['مرتفع',0]:['طبيعي',0]}}
];
var AC=null,muted=false,alarmT=null;
function unlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume()}catch(e){}}
['click','touchstart','keydown'].forEach(function(ev){document.addEventListener(ev,unlock,{passive:true})});
function beep(){
 if(muted)return;
 if(AC&&AC.state==='running'){try{var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type='square';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(660,t+.2);
  g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.4)}catch(e){}}
 try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
function startAlarm(){if(alarmT)return;beep();alarmT=setInterval(beep,1500)}
function stopAlarm(){clearInterval(alarmT);alarmT=null}
document.getElementById('snd').onclick=function(){muted=!muted;this.textContent=muted?'🔕':'🔔';if(muted)stopAlarm();else{unlock();render()}};
var grid=document.getElementById('grid');
C.forEach(function(d){
 var e=document.createElement('section');e.className='card';e.style.setProperty('--c','var('+d.c+')');
 e.innerHTML='<div class="top"><span>'+d.n+'</span><div class="ic">'+d.ic+'</div></div><div class="val"><span id="v-'+d.k+'"></span><small>'+d.u+'</small></div><div class="bar" id="b-'+d.k+'">'+'<i></i>'.repeat(20)+'</div><span class="chip" id="s-'+d.k+'"></span>';
 grid.appendChild(e);
});
function render(){
 var bad=[];
 C.forEach(function(d){
  var v=S[d.k];document.getElementById('v-'+d.k).textContent=v.toFixed(1);
  var n=Math.round(Math.min(v/d.max,1)*20);
  document.querySelectorAll('#b-'+d.k+' i').forEach(function(x,i){x.className=i>=20-n?'on':''});
  var r=d.st(v),ch=document.getElementById('s-'+d.k);ch.textContent=r[0];ch.className='chip'+(r[1]?' bad':'');
  if(r[1])bad.push(r[0]);
 });
 var b=document.getElementById('banner');b.className='banner'+(bad.length?' bad':'');
 document.getElementById('bt').textContent=bad.length?'تنبيه!':'كل شيء آمن';
 document.getElementById('bs').textContent=bad.length?bad.join(' • ')+((!AC||AC.state!=='running')&&!muted?' — المس الشاشة لتفعيل الصوت':''):'جميع الحساسات ضمن الحدود الطبيعية';
 if(bad.length)startAlarm();else stopAlarm();
}
document.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){
 var s=b.dataset.s;
 if(s==='reset')S=Object.assign({},S0);
 if(s==='rain')S.rain=82;
 if(s==='gas')S.gas=78;
 if(s==='flame')S.flame=90;
 if(s==='water')S.water=92;
 render();
}});
setInterval(function(){
 if(!hasCfg()){S.temp=Math.max(0,Math.min(50,S.temp+(Math.random()-.5)*.4));
 S.hum=Math.max(20,Math.min(90,S.hum+(Math.random()-.5)*.6));}
 stamp();
 render();
},10000);
stamp();render();
/* لربط ESP32 لاحقاً: استدعي updateData({temp:..,hum:..,gas:..,rain:..,flame:..,water:..}) */
function updateData(o){Object.assign(S,o);stamp();render()}
var live=false,ws=null,cfg={};
try{cfg=JSON.parse(localStorage.getItem('cfg'))||{}}catch(e){}
var HH=decodeURIComponent((location.hash||'').slice(1));if(HH&&/^[A-Za-z0-9_\-\/]+$/.test(HH)){cfg={mode:'net',net:HH};try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}}
var mode=cfg.mode||'local';
var T={local:['عنوان الـ ESP32 على شبكة البيت','192.168.1.50','إذا فتحت الصفحة من عنوان الـ ESP32 (http://IP) تتصل تلقائياً بدون أي إعداد. وإلا اكتب الـ IP الذي يطبعه Serial Monitor. الاتصال عبر المنفذ 81 ويعمل فقط على نفس شبكة الواي فاي.'],
 net:['اسم القناة (Topic)','esp32-sensors-xxxx/data','يتصل عبر وسيط MQTT مجاني فيعمل من أي شبكة. اكتب نفس اسم القناة الذي يطبعه الـ ESP32 في Serial Monitor. افتح الصفحة من رابط https أو من ملف، وليس من عنوان الـ ESP32.']};
function setMode(m){mode=m;
 document.getElementById('m-local').className=m==='local'?'act':'';
 document.getElementById('m-net').className=m==='net'?'act':'';
 var t=T[m];document.getElementById('lb').textContent=t[0];
 var a=document.getElementById('addr');a.placeholder=t[1];a.value=cfg[m]||'';
 document.getElementById('hint').textContent=t[2];}
function hasCfg(){var m=cfg.mode||'local';return !!(cfg[m]||(m==='local'&&location.protocol==='http:'&&location.hostname))}
function setLive(on){document.getElementById('cs').textContent=on?'متصل':(hasCfg()?'غير متصل':'وضع تجريبي')}
var mq=null,lastMsg=0;
function drop(){if(ws){ws.onclose=null;try{ws.close()}catch(e){}ws=null}if(mq){try{mq.end(true)}catch(e){}mq=null}live=false}
function got(d){lastMsg=Date.now();live=true;setLive(true);updateData(d)}
function connect(){
 drop();var m=cfg.mode||'local',a=cfg[m];
 if(m==='local'&&!a&&location.protocol==='http:')a=location.hostname;
 if(!a){setLive(false);return}
 if(m==='net'){
  if(typeof mqtt==='undefined'){var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js';sc.onload=connect;sc.onerror=function(){document.getElementById('cs').textContent='تعذّر تحميل مكتبة MQTT'};document.head.appendChild(sc);return}
  mq=mqtt.connect('wss://broker.hivemq.com:8884/mqtt',{reconnectPeriod:5000});
  mq.on('connect',function(){mq.subscribe(a)});
  mq.on('message',function(t,p){try{got(JSON.parse(p.toString()))}catch(e){}});
  mq.on('offline',function(){live=false;setLive(false)});
  return;
 }
 var w;try{w=new WebSocket('ws://'+a+':81')}catch(e){setLive(false);return}
 ws=w;
 w.onopen=function(){lastMsg=Date.now();live=true;setLive(true)};
 w.onmessage=function(e){try{got(JSON.parse(e.data))}catch(x){}};
 w.onclose=function(){live=false;setLive(false);setTimeout(function(){if(ws===w)connect()},5000)};
}
setInterval(function(){if(live&&Date.now()-lastMsg>35000){live=false;setLive(false)}},5000);
var ov=document.getElementById('ov');
document.getElementById('gear').onclick=function(){setMode(cfg.mode||'local');ov.hidden=false};
document.getElementById('m-local').onclick=function(){setMode('local')};
document.getElementById('m-net').onclick=function(){setMode('net')};
document.getElementById('cancel').onclick=function(){ov.hidden=true};
document.getElementById('save').onclick=function(){
 cfg[mode]=document.getElementById('addr').value.trim();cfg.mode=mode;
 try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}
 ov.hidden=true;connect();applyMode();
};
setLive(false);connect();
function applyMode(){document.querySelector('.sim').style.display=hasCfg()?'none':''}
if(hasCfg()){S={temp:0,hum:0,gas:0,rain:0,flame:0,water:0};render()}
applyMode();

</script>
</body>
</html>
